<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80">
  <!-- Cognizant hexagon icon -->
  <g transform="translate(8,8)">
    <!-- Twisted ribbon hexagon mark -->
    <polygon points="32,4 52,4 64,24 52,44 32,44 20,24" fill="none" stroke="#0033A0" stroke-width="3"/>
    <!-- Inner top-left facet -->
    <polygon points="32,4 52,4 52,14 42,20 32,14" fill="#0033A0" opacity="0.85"/>
    <!-- Inner bottom facet -->
    <polygon points="42,20 52,14 64,24 52,34 42,28" fill="#00A3E0" opacity="0.9"/>
    <!-- Inner left facet -->
    <polygon points="20,24 32,14 42,20 42,28 32,34" fill="#0033A0" opacity="0.6"/>
    <!-- Bottom connector -->
    <polygon points="32,34 42,28 52,34 52,44 32,44" fill="#00A3E0" opacity="0.7"/>
  </g>
  <!-- Wordmark -->
  <text x="82" y="52" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0033A0" letter-spacing="-0.5">cognizant</text>
</svg>
